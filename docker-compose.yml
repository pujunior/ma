services:
  postgres:
    image: postgres:16-alpine
    container_name: chapada-conectada-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chapada
      POSTGRES_PASSWORD: chapada_dev
      POSTGRES_DB: chapada_conectada
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapada -d chapada_conectada"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
